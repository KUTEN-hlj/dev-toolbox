<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevToolbox - 开发者工具箱</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside id="sidebar">
        <div class="sidebar-header" onclick="location.hash='';App.renderWelcome()">
            <h1 class="logo">🧰 DevToolbox</h1>
            <span class="version">v0.1</span>
        </div>

        <nav id="tool-nav">
            <div class="nav-section-title">工具列表</div>
            <div id="tool-list"></div>
        </nav>

        <div class="sidebar-footer">
            <span id="sidebar-status">🚀 服务运行中</span>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main id="main">
        <!-- 顶部导航栏 -->
        <header id="topbar">
            <div class="topbar-left">
                <span id="topbar-title">首页</span>
            </div>
            <div class="topbar-right" id="topbar-user">
                <button id="btn-login-top" class="btn btn-primary">登录 / 注册</button>
            </div>
        </header>
        <div id="tool-container">
            <div class="welcome">
                <h2>👋 欢迎使用 DevToolbox</h2>
                <p>开发者在线工具箱 — 从左侧选择一个工具开始</p>
            </div>
        </div>
    </main>

    <!-- 登录/注册弹窗 -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>
            <form id="login-form" class="auth-form">
                <input type="text" name="username" placeholder="用户名" required autocomplete="username">
                <input type="password" name="password" placeholder="密码" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
            <form id="register-form" class="auth-form hidden">
                <input type="text" name="username" placeholder="用户名" required autocomplete="username">
                <input type="email" name="email" placeholder="邮箱" required autocomplete="email">
                <input type="password" name="password" placeholder="密码（至少6位）" required minlength="6" autocomplete="new-password">
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
            <p id="auth-error" class="auth-error hidden"></p>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="/js/api.js"></script>
    <script src="/js/tools/base64.js"></script>
    <script src="/js/tools/urlcodec.js"></script>
    <script src="/js/tools/jsonfmt.js"></script>
    <script src="/js/tools/jwtdebug.js"></script>
    <script src="/js/tools/cronparser.js"></script>
    <script src="/js/tools/regextest.js"></script>
    <script src="/js/tools/hashgen.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
